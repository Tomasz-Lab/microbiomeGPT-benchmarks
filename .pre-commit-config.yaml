repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (auto-fix)
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
        pass_filenames: true

      - id: ruff-format
        name: Ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
        pass_filenames: true
