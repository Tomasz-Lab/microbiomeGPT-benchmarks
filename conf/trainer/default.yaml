_target_: lightning.pytorch.Trainer

max_epochs: 55
# On Apple Silicon "auto" picks MPS, where training fails (no torch.cdist backward); use cpu there
accelerator: auto
devices: auto
num_sanity_val_steps: 0
log_every_n_steps: 1
enable_progress_bar: true
default_root_dir: ${hydra:runtime.output_dir}
# null (off), "simple", "advanced" or "pytorch"; or a config with _target_ for profiler options
profiler: null

callbacks:
  - _target_: gut_former.callbacks.RunLogger

  # D:0001
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${hydra:runtime.output_dir}/checkpoints
    filename: "best"
    monitor: val_loss
    mode: min
    save_top_k: 1
    save_weights_only: true
    enable_version_counter: false

  # D:0001
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${hydra:runtime.output_dir}/checkpoints
    filename: "last"
    save_top_k: 1
    monitor: null
    save_weights_only: false
    enable_version_counter: false


# lightning_logs/version_0/metrics.csv is the run's metrics log
logger:
  - _target_: lightning.pytorch.loggers.WandbLogger
    project: "microbiomeGPT"            
    entity: "sano-centre-for-computational-medicine-microbiome-gpt"
    name: "run-${now:%Y-%m-%d_%H-%M-%S}"
    save_dir: "${hydra:runtime.output_dir}"
    log_model: false # don't send data to WB cloud anytime (even after sync)
    offline: false # set true on VM that do not have acccess to internet or if you manually want to sync logs later
