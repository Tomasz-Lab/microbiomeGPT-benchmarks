_target_: lightning.pytorch.Trainer

max_epochs: 55
# On Apple Silicon "auto" picks MPS, where training fails (no torch.cdist backward); use cpu there
accelerator: auto
devices: auto
num_sanity_val_steps: 0
log_every_n_steps: 1
enable_progress_bar: true
default_root_dir: ${hydra:runtime.output_dir}
# null (off), "simple", "advanced" or "pytorch"; or a config with _target_ for profiler options
profiler: null

callbacks:
  - _target_: gut_former.callbacks.RunLogger

  # D:0001
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${hydra:runtime.output_dir}/checkpoints
    filename: "best"
    monitor: val_loss
    mode: min
    save_top_k: 1
    save_weights_only: true
    enable_version_counter: false

  # D:0001
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${hydra:runtime.output_dir}/checkpoints
    filename: "last"
    save_top_k: 1
    monitor: null
    save_weights_only: false
    enable_version_counter: false


logger:
  - _target_: lightning.pytorch.loggers.WandbLogger
    project: "microbiomeGPT"            
    entity: "sano-centre-for-computational-medicine-microbiome-gpt"
    name: "${model.name}__${dataset.name}__${now:%Y-%m-%d_%H-%M-%S}"
    save_dir: "${hydra:runtime.output_dir}"
    log_model: false # don't send data to WB cloud anytime (even after sync)
    offline: false # set true on VM that do not have acccess to internet or if you manually want to sync logs later
    tags:
      - "${model.name}"     # eg. gut_former
      - "${model.model_version}"       # eg. v1-0-0
      - "${dataset.name}"              # eg. gutmap
      - "${experiment.purpose}"        # debug / test-run / baseline / production
    job_type: train
    group: null
    notes: null
    
    settings: 
      # wandb defualt assumes that all runs are in single wandb directory, 
      # but beacause we are using hydra, each run is in a different directory,
      # so symlink (for a latest run in project) for us is not needed and 
      # we can set it to false to avoid confusion ~ Fasamik39
      _target_: wandb.Settings
      symlink: false
      # D: 0003 save code saves main code that runs the experiment to wandb cloud, but what is more
      # important is that it save also diff.patch so together with hash commit we are able to recrate 
      # even uncommited changes that were used to run the experiment. ~Fasamik39
      save_code: true 
