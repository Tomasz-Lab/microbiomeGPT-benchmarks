defaults:
  - experiment: nmf_pathways
  - _self_

hydra:
  job:
    chdir: false

  run:
    dir: ${oc.env:OUTPUT_HYDRA,.}/${experiment.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

  sweep:
    dir: ${oc.env:OUTPUT_MULTIRAN_HYDRA,.}/${experiment.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}