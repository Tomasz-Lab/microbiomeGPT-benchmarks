# @package _global_

defaults:
  - /task: run_gut_former_training
  - /model: gut_former
  - /system: autoencoder
  - /modataset: gut_metaphlan_humann
  - /datamodule: bacteria
  - /trainer: default
  # every multirun job in its own process, so each gets its own W&B run (ADR 0005)
  - override /hydra/launcher: submitit_local
  - _self_

experiment:
  name: gut_former_training

# D: 0003 the one place that describes the run; loggers only read from it
run:
  name: "${run.model_name}__${dataset.name}__${now:%Y-%m-%d}_${now:%H-%M-%S}"
  # the model config only holds GutFormer's constructor args, so its identity lives here
  model_name: gut_former                  # ~Fasamik39
  model_version: v1-0-0                   # ~Fasamik39
  dataset_name: ${dataset.name}           # eg. gutmap ~Fasamik39
  purpose: debug                          # debug / test-run / baseline / production ~Fasamik39
  job_type: train
  group: null
  notes: null

hydra:
  launcher:
    timeout_min: 1440