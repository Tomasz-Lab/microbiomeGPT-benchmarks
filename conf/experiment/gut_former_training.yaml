# @package _global_

defaults:
  - /task: run_gut_former_training
  - /model: gut_former
  - /system: autoencoder
  - /dataset: csv
  - /datamodule: bacteria_csv
  - /trainer: default
  # every multirun job in its own process, so each gets its own W&B run (ADR 0005)
  - override /hydra/launcher: submitit_local
  - _self_

experiment:
  name: gut_former_training

# D: 0003 the one place that describes the run; loggers only read from it
run:
  name: "${model.name}__${dataset.name}__${now:%Y-%m-%d_%H-%M-%S}"
  model_name: ${model.name}               # eg. gut_former
  model_version: ${model.model_version}   # eg. v1-0-0
  dataset_name: ${dataset.name}           # eg. gutmap
  purpose: debug                          # debug / test-run / baseline / production
  job_type: train
  group: null
  notes: null

hydra:
  launcher:
    timeout_min: 1440