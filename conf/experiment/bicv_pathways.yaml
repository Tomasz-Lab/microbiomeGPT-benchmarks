# @package _global_

defaults:
  - /task: run_bicv_nmf
  - /model: nmf
  - /dataset: csv
  - _self_

experiment:
  name: bicv_pathways

dataset:
  kind: pathways
  subset: all

model:
  parameters:
    # BiCV parallelizes folds/signatures; keep NMF's inner random starts sequential.
    # The regular NMF experiment retains its parallel n_jobs setting.
    n_jobs: 1
