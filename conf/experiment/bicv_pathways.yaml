# @package _global_

defaults:
  - /task: run_bicv_nmf
  - /model: nmf
  - /modataset: gut_metaphlan_humann
  - _self_

experiment:
  name: bicv_pathways

task:
  modality: pathways_humann
  subset: all
  multiplier: 100
  collapse_to_genus: false

model:
  parameters:
    # BiCV parallelizes folds/signatures; keep NMF's inner random starts sequential.
    # The regular NMF experiment retains its parallel n_jobs setting.
    n_jobs: 1
