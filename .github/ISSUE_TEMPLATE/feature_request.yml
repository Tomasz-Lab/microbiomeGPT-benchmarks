name: "Feature Request"
description: "Suggest new functionality or a meaningful improvement."
type: "Feature"
labels: ["feature"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: "Problem / Motivation"
      description: "What problem are we trying to solve, and why does it matter?"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Proposed Solution"
      description: "Describe the requested behavior or capability."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance Criteria"
      description: "List observable outcomes that would make this feature complete."
      placeholder: |
        - [ ] ...
        - [ ] New feature is covered with relevant tests.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives / Additional Context"
      description: "Optional alternatives, references, diagrams, or related issues."
    validations:
      required: false
