name: Tests

on:
  pull_request:
    branches:
      - develop
      - 'release/**'

permissions:
  contents: read

jobs:
  tests:
    name: Tests and type check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run mypy
        run: make typecheck

      - name: Run tests
        if: ${{ !cancelled() }}
        run: uv run pytest
