name: Sync Issue and Pull Request

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]
  issues:
    types: [labeled, unlabeled, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to synchronize"
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  sync:
    # Fork PRs receive read-only GITHUB_TOKEN on pull_request events.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const allowed = new Set([
              'bug', 'feature', 'refactor', 'chore', 'CI/CD',
              'documentation', 'tests', 'research', 'skip-changelog'
            ]);
            const keywords = {bug: 'Fixes', feature: 'Closes', task: 'Resolves'};
            const start = '<!-- sync-issue-pr:start -->';
            const end = '<!-- sync-issue-pr:end -->';

            // Remove template instructions: example issue numbers inside HTML
            // comments must not be interpreted as real references.
            const stripComments = body => (body || '').replace(/<!--[\s\S]*?-->/g, '');
            const references = body => [...stripComments(body).matchAll(
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|related\s+to)\s+(?:[\w.-]+\/[\w.-]+)?#(\d+)\b/gi
            )].map(m => Number(m[1]));

            const managedExpression = /<!-- sync-issue-pr:start -->[\s\S]*?<!-- sync-issue-pr:end -->/g;
            const originalBody = body => (body || '').replace(managedExpression, '');

            async function linkedByGithub(number) {
              const query = `query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    closingIssuesReferences(first:20) {
                      nodes { number repository { nameWithOwner } }
                    }
                  }
                }
              }`;
              const data = await github.graphql(query, {owner, repo, number});
              return (data.repository.pullRequest.closingIssuesReferences.nodes || [])
                .filter(issue => issue.repository.nameWithOwner.toLowerCase() === `${owner}/${repo}`.toLowerCase())
                .map(issue => issue.number);
            }

            async function sync(pr, changedIssue = null) {
              if (pr.state !== 'open') return;
              const source = originalBody(pr.body);
              const bodyRefs = references(source);
              const branchMatch = /^(?:[^/]+\/)?(\d+)-/.exec(pr.head.ref);
              const branchRefs = branchMatch ? [Number(branchMatch[1])] : [];
              const githubRefs = await linkedByGithub(pr.number);
              const candidates = [...new Set([...bodyRefs, ...branchRefs, ...githubRefs])];

              if (candidates.length !== 1) {
                core.warning(`PR #${pr.number}: expected one issue, found ${candidates.join(', ') || 'none'}. Skipping.`);
                return;
              }
              const number = candidates[0];
              if (changedIssue !== null && number !== changedIssue) return;

              let issue;
              try {
                ({data: issue} = await github.rest.issues.get({owner, repo, issue_number: number}));
              } catch (error) {
                if (error.status === 404) {
                  core.warning(`PR #${pr.number}: issue #${number} does not exist.`);
                  return;
                }
                throw error;
              }
              if (issue.pull_request) {
                core.warning(`PR #${pr.number}: #${number} is another PR, not an issue.`);
                return;
              }

              const desired = (issue.labels || [])
                .map(label => typeof label === 'string' ? label : label.name)
                .filter(label => allowed.has(label));
              const existing = new Set((pr.labels || []).map(label => label.name));
              const missing = desired.filter(label => !existing.has(label));
              if (missing.length) {
                await github.rest.issues.addLabels({owner, repo, issue_number: pr.number, labels: missing});
                core.info(`PR #${pr.number}: added ${missing.join(', ')}`);
              }

              const type = (issue.type?.name || '').toLowerCase();
              const keyword = keywords[type];
              if (!keyword) {
                core.warning(`Issue #${number}: unsupported or missing Issue Type; labels synced, closing keyword not added.`);
                return;
              }

              const closing = `${keyword} #${number}`;
              const existingManualClosing = new RegExp(
                `\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s+#${number}\\b`, 'i'
              ).test(stripComments(source));
              const oldBody = pr.body || '';
              let newBody;
              if (existingManualClosing) {
                // Existing manual closing reference is not modified.
                newBody = oldBody.replace(managedExpression, '').trimEnd();
              } else {
                const block = `${start}\n${closing}\n${end}`;
                newBody = managedExpression.test(oldBody)
                  ? oldBody.replace(managedExpression, block)
                  : `${oldBody.trimEnd()}\n\n${block}`.trim();
              }
              if (newBody !== oldBody) {
                await github.rest.pulls.update({owner, repo, pull_number: pr.number, body: newBody});
                core.info(`PR #${pr.number}: updated closing reference to ${closing}`);
              }
            }

            if (context.eventName === 'pull_request') {
              await sync(context.payload.pull_request);
            } else if (context.eventName === 'workflow_dispatch') {
              const number = Number(context.payload.inputs.pr_number);
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
              await sync(pr);
            } else if (context.eventName === 'issues') {
              const changedIssue = context.payload.issue.number;
              // Search current open PRs so an issue-label edit can update them.
              // This uses GitHub's native links as well as body/branch references.
              const prs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100
              });
              for (const pr of prs) {
                await sync(pr, changedIssue);
              }
            }
