name: Sync Issue and Pull Request

# Label synchronization is add-only: allowlisted issue labels are copied to the
# PR, but removing a label from the issue never removes it from the PR.
# Linking an issue in the PR sidebar emits no workflow event; run this workflow
# manually (workflow_dispatch) or edit the PR to synchronize such a link.
on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]
  issues:
    types: [labeled, typed, untyped]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to synchronize"
        required: true
        type: number

# The script never checks out or runs PR code; it only reads issues and PRs
# and edits PR labels and descriptions.
permissions:
  issues: read
  pull-requests: write

# Serializes runs for the same PR (PR events and manual runs) and for the same
# issue. Known limitations, kept simple on purpose:
# - An issue-triggered run and a PR-triggered run for the same PR use different
#   groups and can overlap. Each re-reads the PR before writing, but if the issue
#   type changes while a PR run is in progress, that run may write the old
#   keyword after the issue run wrote the new one. Re-run manually to correct.
# - Re-reading and updating a PR body are separate requests, so a human edit made
#   in between can be overwritten.
concurrency:
  group: sync-issue-pr-${{ github.event.pull_request.number || inputs.pr_number || format('issue-{0}', github.event.issue.number) }}
  cancel-in-progress: false

jobs:
  sync:
    # Same-repository PRs only; fork PRs receive a read-only GITHUB_TOKEN.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const thisRepo = `${owner}/${repo}`.toLowerCase();
            // Issue labels copied to PRs. 'skip-changelog' is planned for changelog
            // generation (#25) and must be created before it can take effect.
            // Triage labels (help wanted, question, wontfix, epic) are not copied.
            const allowed = new Set([
              'bug', 'feature', 'refactor', 'chore', 'CI/CD',
              'documentation', 'tests', 'research', 'skip-changelog'
            ]);
            const keywords = {bug: 'Fixes', feature: 'Closes', task: 'Resolves'};
            const start = '<!-- sync-issue-pr:start -->';
            const end = '<!-- sync-issue-pr:end -->';
            // Leading newlines are consumed so that removing a block leaves no gap.
            // Global expressions are only used with replace() and matchAll(), which do
            // not depend on lastIndex state between calls.
            const managedBlocks = /\n*<!-- sync-issue-pr:start -->[\s\S]*?<!-- sync-issue-pr:end -->/g;

            // Issue reference: #N, owner/repo#N or an issues URL. The qualifier
            // (groups 1/2) is checked against the current repository, so references
            // to other repositories (e.g. the former upstream) are never local issues.
            const ref = String.raw`(?:https?:\/\/github\.com\/([\w.-]+\/[\w.-]+)\/issues\/|([\w.-]+\/[\w.-]+)?#)(\d+)\b`;
            // "Closes #N" or "Closes: #N"; never crosses a line break.
            const separator = String.raw`(?:[ \t]*:[ \t]*|[ \t]+)`;
            const closingExpression = new RegExp(
              String.raw`\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)${separator}${ref}`, 'gi'
            );
            const relatedExpression = new RegExp(String.raw`\brelated[ \t]+to${separator}${ref}`, 'gi');

            // Bodies edited in the web UI use CRLF; compare and write with LF only.
            const normalize = body => (body || '').replace(/\r\n?/g, '\n');
            // The PR body without the workflow-managed block(s).
            const userContent = body => normalize(body).replace(managedBlocks, '');
            // Text searched for issue references: user content without HTML comments
            // (template instructions with example numbers) and code.
            const manualText = body => userContent(body)
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/```[\s\S]*?```|`[^`\n]*`/g, '');
            const references = (text, expression) => [...new Set([...text.matchAll(expression)]
              .filter(m => {
                const qualifier = m[1] || m[2];
                return !qualifier || qualifier.toLowerCase() === thisRepo;
              })
              .map(m => Number(m[3])))];

            // Issues linked manually in the PR sidebar. userLinkedOnly excludes links
            // GitHub derives from closing keywords, including the managed block.
            async function linkedByGithub(number) {
              const query = `query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    closingIssuesReferences(first:20, userLinkedOnly:true) {
                      nodes { number repository { nameWithOwner } }
                    }
                  }
                }
              }`;
              const data = await github.graphql(query, {owner, repo, number});
              return [...new Set((data.repository.pullRequest.closingIssuesReferences.nodes || [])
                .filter(issue => issue.repository.nameWithOwner.toLowerCase() === thisRepo)
                .map(issue => issue.number))];
            }

            // Primary issue by priority: manual closing keyword > branch name >
            // native sidebar link > "Related to". Disagreement within one level
            // is a conflict; a higher level always wins over a lower one.
            async function resolveIssue(pr) {
              const text = manualText(pr.body);
              const branchMatch = /^(?:[^/]+\/)?(\d+)-/.exec(pr.head.ref);
              const branch = branchMatch ? Number(branchMatch[1]) : null;

              const manual = references(text, closingExpression);
              if (manual.length > 1) return {problem: `manual closing keywords reference #${manual.join(', #')}`};
              if (manual.length === 1) {
                if (branch !== null && branch !== manual[0]) {
                  core.warning(`PR #${pr.number}: branch references #${branch}, manual closing keyword #${manual[0]} takes precedence.`);
                }
                return {number: manual[0], manual: true};
              }
              if (branch !== null) return {number: branch};

              const linked = await linkedByGithub(pr.number);
              if (linked.length > 1) return {problem: `linked issues #${linked.join(', #')}`};
              if (linked.length === 1) return {number: linked[0]};

              const related = references(text, relatedExpression);
              if (related.length > 1) return {problem: `"Related to" references #${related.join(', #')}`};
              if (related.length === 1) return {number: related[0]};
              return {problem: 'no issue reference found'};
            }

            async function getIssue(pr, number) {
              let issue;
              try {
                ({data: issue} = await github.rest.issues.get({owner, repo, issue_number: number}));
              } catch (error) {
                if (error.status === 404) {
                  core.warning(`PR #${pr.number}: issue #${number} does not exist.`);
                  return null;
                }
                throw error;
              }
              if (issue.pull_request) {
                core.warning(`PR #${pr.number}: #${number} is another PR, not an issue.`);
                return null;
              }
              return issue;
            }

            // Puts the block at the end of the (normalized) body, or removes all
            // managed blocks when block is null. Content outside the markers is
            // never changed, apart from trailing whitespace and line endings.
            function withManagedBlock(body, block) {
              const content = userContent(body);
              if (block) return [content.trimEnd(), block].filter(Boolean).join('\n\n');
              return content === body ? body : content.trimEnd();
            }

            const missingLabels = (issue, pr) => (issue?.labels || [])
              .map(label => typeof label === 'string' ? label : label.name)
              .filter(label => allowed.has(label))
              .filter(label => !(pr.labels || []).some(existing => existing.name === label));

            // Primary issue and the managed block it requires (null: no block).
            async function decide(pr) {
              const resolved = await resolveIssue(pr);
              let issue = null;
              if (resolved.number === undefined) {
                core.warning(`PR #${pr.number}: cannot determine the primary issue (${resolved.problem}).`);
              } else {
                issue = await getIssue(pr, resolved.number);
              }

              // A manual closing keyword is left as written and needs no managed block.
              let block = null;
              if (issue && !resolved.manual) {
                const keyword = keywords[(issue.type?.name || '').toLowerCase()];
                if (keyword) {
                  block = `${start}\n${keyword} #${issue.number}\n${end}`;
                } else {
                  core.warning(`Issue #${issue.number}: unsupported or missing Issue Type; closing keyword not added.`);
                }
              }
              return {number: resolved.number, issue, block};
            }

            // pr may be stale (event payload, PR list). It is only used to skip PRs
            // cheaply; anything written is based on the PR as re-read below.
            async function sync(pr, changedIssue = null) {
              if (pr.state !== 'open') return;
              if ((pr.head.repo?.full_name || '').toLowerCase() !== thisRepo) {
                core.info(`PR #${pr.number}: fork PRs are not synchronized.`);
                return;
              }
              let decision = await decide(pr);
              if (changedIssue !== null && decision.number !== changedIssue) return;
              const snapshotBody = normalize(pr.body);
              if (!missingLabels(decision.issue, pr).length &&
                  withManagedBlock(snapshotBody, decision.block) === snapshotBody) return;

              const {data: latest} = await github.rest.pulls.get({owner, repo, pull_number: pr.number});
              if (latest.state !== 'open') return;
              // The decision depends on the branch name and the user-written body
              // (trailing whitespace aside). If either changed, decide again from the
              // latest state. If the PR no longer belongs to changedIssue, leave it to
              // the run triggered by that PR edit.
              if (latest.head.ref !== pr.head.ref ||
                  userContent(latest.body).trimEnd() !== userContent(pr.body).trimEnd()) {
                core.notice(`PR #${pr.number}: changed since the event; re-evaluating the latest state.`);
                decision = await decide(latest);
                if (changedIssue !== null && decision.number !== changedIssue) return;
              }
              const {issue, block} = decision;

              // Not atomic: an edit made between the read above and this update is
              // overwritten (GitHub has no conditional update for PR bodies).
              const oldBody = normalize(latest.body);
              const newBody = withManagedBlock(oldBody, block);
              if (newBody !== oldBody) {
                await github.rest.pulls.update({owner, repo, pull_number: pr.number, body: newBody});
                core.info(`PR #${pr.number}: ${block ? `managed closing reference set for #${issue.number}` : 'managed closing reference removed'}`);
              }
              const missing = missingLabels(issue, latest);
              if (missing.length) {
                await github.rest.issues.addLabels({owner, repo, issue_number: pr.number, labels: missing});
                core.info(`PR #${pr.number}: added ${missing.join(', ')}`);
              }
            }

            if (context.eventName === 'pull_request') {
              await sync(context.payload.pull_request);
            } else if (context.eventName === 'workflow_dispatch') {
              const number = Number(context.payload.inputs.pr_number);
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
              await sync(pr);
            } else if (context.eventName === 'issues') {
              if (context.payload.action === 'labeled' && !allowed.has(context.payload.label?.name)) {
                core.info(`Label "${context.payload.label?.name}" is not synchronized.`);
                return;
              }
              const changedIssue = context.payload.issue.number;
              // Search current open PRs so an issue label or type change can update them.
              // This uses GitHub's native links as well as body/branch references.
              const prs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100
              });
              // One failing PR must not prevent the others from being synchronized.
              const failed = [];
              for (const pr of prs) {
                try {
                  await sync(pr, changedIssue);
                } catch (error) {
                  failed.push(pr.number);
                  core.error(`PR #${pr.number}: ${error.message}`);
                }
              }
              if (failed.length) core.setFailed(`Synchronization failed for PR #${failed.join(', #')}.`);
            }
