name: Lint

on:
  pull_request:
    branches:
      - develop
      - 'release/**'

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff linting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'check --output-format=github .'
