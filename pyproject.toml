[project]
name = "gut-former"
version = "0.1.0"
description = "GUT-FORMer by TomaszLab"
authors = [{ name = "Zuzanna Karwowska, Tomasz Kościółek, Wojciech Nowak" }]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "torch>=2.10.0,<3",
    "numpy>=2.4.1,<3",
    "pandas>=3.0.0,<4",
    "scikit-learn>=1.8.0,<2",
    "matplotlib>=3.10.8,<4",
    "seaborn>=0.13.2,<0.14",
    "torchmetrics>=1.8.2,<2",
    "scikit-bio>=0.7.2,<0.8",
    "optuna>=4.7.0,<5",
    "sweetviz>=2.3.3,<3",
    "hydra-core>=1.3.7",
    "python-dotenv>=1.2.4",
]

[project.scripts]
gut-former = "gut_former.main:main"

[tool.hatch.build.targets.sdist]
include = ["src/gut_former"]

[tool.hatch.build.targets.wheel]
include = ["src/gut_former"]

[tool.hatch.build.targets.wheel.sources]
"src/gut_former" = "gut_former"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff (>=0.14.0,<0.15.0)",
    "mypy (>=1.19.0,<2.0.0)",
    "jupyter (>=1.1.0,<2.0.0)",
    "ipykernel (>=7.1.0,<8.0.0)"
,
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # bugbear (common bugs)
    "UP",   # pyupgrade (modern Python syntax)
]
ignore = ["E501"]  # Let formatter handle line length

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
